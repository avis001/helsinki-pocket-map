<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3b5c">
<title>Helsinki Pocket Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed map, floating layer chips, bottom sheet list. Colours follow the Helsinki Personal Map spec. */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --fg:#14232e; --muted:#5d6e7a; --line:#dde4e8;
  --accent:#0f5c8f; --me:#1a73e8;
  --c-plan:#159E9C; --c-notes:#8863B5; --c-classics:#D85B58; --c-culture:#487FC5; --c-art:#D77CA8;
  --c-sauna:#D89A35; --c-family:#E7C34B; --c-shop:#69BBD4; --c-nature:#66A36C; --c-harbour:#566274;
  --c-utility:#8a949e;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sheet-peek:92px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1418; --panel:#162027; --fg:#e6edf1; --muted:#93a4af; --line:#26343d;
  --accent:#6fb4e6; --me:#5ea2ff; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);overflow:hidden}
#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:brightness(.72) invert(1) hue-rotate(180deg) saturate(.6) contrast(.9)}}

.top{position:fixed;top:0;left:0;right:0;z-index:500;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.brand{pointer-events:auto;display:inline-flex;align-items:baseline;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 2px 10px rgb(0 0 0 / .12)}
.brand h1{margin:0;font:800 19px/1 var(--display);font-stretch:80%;letter-spacing:.01em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted)}
.chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px;scrollbar-width:none;max-width:calc(100% - 52px)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  font:600 12px/1 var(--body);padding:7px 10px;border-radius:999px;cursor:pointer;box-shadow:0 1px 4px rgb(0 0 0 / .08)}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip[aria-pressed="false"]{opacity:.45}

.fab{position:fixed;z-index:500;right:max(12px,env(safe-area-inset-right,0px));
  width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 12px rgb(0 0 0 / .2)}
.fab svg{width:24px;height:24px}
#locate{bottom:calc(var(--sheet-peek) + 16px)}
#locate.on{color:var(--me)}
#locate.follow{background:var(--me);color:#fff;border-color:var(--me)}

.status{position:fixed;z-index:500;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-peek) + 80px);
  background:var(--fg);color:var(--bg);font-size:13px;padding:8px 12px;border-radius:8px;max-width:calc(100% - 32px);text-align:center}

.sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgb(0 0 0 / .15);height:var(--sheet-peek);
  transition:height .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{height:62%}
.handle{border:0;background:none;color:var(--fg);width:100%;cursor:pointer;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));text-align:left}
.handle::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.handle strong{font:700 15px/1.2 var(--display);font-stretch:85%;text-transform:uppercase;letter-spacing:.03em}
.handle small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.list{overflow-y:auto;flex:1;padding:0 max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  list-style:none;margin:0}
.list li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.list li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list li.done b{color:var(--muted)}
.num{width:28px;height:28px;margin:2px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--display);color:#fff}
.num.dark{color:#14232e}
.num.sq{border-radius:6px}
.num.x{background:none!important;color:var(--c-notes);font-size:22px}
.list b{font-weight:600;display:block}
.list p{margin:2px 0 0;color:var(--muted);font-size:13px;min-width:0}
.dist{font-variant-numeric:tabular-nums;font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;padding-top:4px;text-align:right}
.tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;vertical-align:1px}
.tag.circ{color:var(--c-notes)}
.tag.plan{color:#fff;background:var(--c-plan);padding:2px 5px;border-radius:4px}
.tag.done{color:var(--c-nature)}

.pin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--display);color:#fff;
  border:2px solid #fff;box-shadow:0 1px 4px rgb(0 0 0 / .4)}
.pin.dark{color:#14232e}
.pin.sq{border-radius:6px;font-size:13px}
.pin.circ{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c-notes),0 1px 6px rgb(0 0 0 / .4)}
.num.circ{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c-notes)}
.pin.done{font-size:15px}
.pin.x{background:none!important;border:0;box-shadow:none;color:var(--c-notes);font-size:28px;text-shadow:0 0 3px #fff,0 0 3px #fff}
.pin.util{background:var(--c-utility);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:var(--c-plan);color:#fff;
  font:700 11px/1 var(--display);padding:4px 6px;border-radius:5px;border:1.5px solid #fff;box-shadow:0 1px 4px rgb(0 0 0 / .35)}
.badge span{font-weight:500;opacity:.9}

.leaflet-popup-content{font:14px/1.4 var(--body);margin:12px 14px}
.leaflet-popup-content h3{margin:0 0 4px;font:700 15px/1.2 var(--display)}
.leaflet-popup-content .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5d6e7a}
.leaflet-popup-content .circled{color:#8863B5;font-weight:700}
.leaflet-popup-content .planline{margin:6px 0;padding:6px 8px;border-left:3px solid #159E9C;background:#159E9C1a;border-radius:0 6px 6px 0}
.leaflet-popup-content a{color:#0f5c8f;font-weight:600}
.leaflet-popup-content .links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.visit{margin-top:10px;width:100%;border:1px solid #cfd8dd;background:#fff;color:#14232e;font:600 13px/1 var(--body);padding:9px;border-radius:8px;cursor:pointer}
.visit.on{background:#66A36C;border-color:#66A36C;color:#fff}
.me-dot{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 2px rgb(26 115 232 / .35),0 1px 4px rgb(0 0 0 / .4)}
.me-wrap{position:relative}
.me-cone{position:absolute;left:50%;top:50%;width:0;height:0;margin-left:-14px;margin-top:-38px;
  border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:30px solid rgb(26 115 232 / .35);transform-origin:14px 38px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Helsinki"></div>

<div class="top">

</button>
<div class="status" id="status" hidden></div>

<section class="sheet" id="sheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

const P = [

const CIRCLED = new Set(["p1","p2","p4","p6","p7","p9","p10","p13","p25","p28","p29","p31","p42"]);

// ---------- Monday overlay: references existing pins ----------
const PLAN = [
 {stop:"A",time:"10:00–10:45",key:"p13",  text:"Copper dome, exposed rock, natural light."},

const PLAN_ROUTE = [[60.1730,24.9253],[60.1715,24.9300],[60.1690,24.9385],[60.1660,24.9430],[60.1620,24.9450],[60.1590,24.9455],[60.15745,24.9458],

];

// ---------- Helpers ----------
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim();
const byKey = Object.fromEntries(P.map(p=>[p[0],p]));
const planOf = Object.fromEntries(PLAN.map(s=>[s.key,s]));
const gmaps = (lat,lng)=>`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
const gplace = name=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+', Helsinki')}`;
const store = { get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}} };
const visited = new Set(store.get('hpm-visited',[]));
const catColor = cat => cat==='utility'?'var(--c-utility)':CATS[cat].color;
const isDark = cat => !!(CATS[cat]&&CATS[cat].dark);
const shape = p => p[1]==='X'?'x':(p[2]==='utility'?'util':(p[2]==='notes'||p[2]==='plan'?'sq':''));

// ---------- Map ----------
const map = L.map('map',{zoomControl:false}).setView([60.1680,24.9420],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

const layers = {}; Object.keys(CATS).forEach(k=>layers[k]=L.layerGroup().addTo(map));
const utilLayer = L.layerGroup().addTo(map);
const walkLayer = L.layerGroup();      // shown with "notes"
const planLayer = L.layerGroup();      // route + badges, shown with "plan"
const markers = {};

function pinIcon(p){
  const [key,label,cat]=p, done=visited.has(key), s=shape(p);
  const txt = s==='x' ? '✕' : (done ? '✓' : label);
  const cls = ['pin',s,isDark(cat)&&!done?'dark':'',CIRCLED.has(key)?'circ':'',done?'done':''].join(' ');
  const bg = done && s!=='x' ? `background:${css(catColor(cat))};color:#fff` : `background:${css(catColor(cat))}`;
  return L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],html:`<div class="${cls}" style="${bg}">${txt}</div>`});
}
function popup(p){
  const [key,label,cat,name,lat,lng,note]=p, pl=planOf[key];
  const el=document.createElement('div');
  const catLabel = cat==='utility'?'Utility':CATS[cat].label;
  el.innerHTML = `<span class="cat">${catLabel}</span><h3>${typeof label==='number'?label+'. ':''}${name}</h3>`+
    (CIRCLED.has(key)?'<span class="circled">◎ Circled on your map.</span> ':'')+(note||'')+
    (pl?`<div class="planline"><b>Monday ${pl.stop==='+'?'(optional)':pl.stop+' · '+pl.time}</b><br>${pl.text}</div>`:'')+
    `<div class="links"><a href="${gmaps(lat,lng)}" target="_blank" rel="noopener">Walking directions ↗</a><a href="${gplace(name)}" target="_blank" rel="noopener">Reviews on Google ↗</a></div>`;
  if(cat!=='utility'){
    const b=document.createElement('button');b.className='visit'+(visited.has(key)?' on':'');
    b.textContent=visited.has(key)?'✓ Visited · tap to undo':'Mark as visited';
    b.onclick=()=>{visited.has(key)?visited.delete(key):visited.add(key);store.set('hpm-visited',[...visited]);
      markers[key].setIcon(pinIcon(p));markers[key].closePopup();renderList();};
    el.appendChild(b);
  }
  return el;
}
P.forEach(p=>{
  const [key,,cat,name,lat,lng]=p;
  const m=L.marker([lat,lng],{icon:pinIcon(p),title:name,zIndexOffset:planOf[key]?600:0}).bindPopup(()=>popup(p));
  markers[key]=m;
  if(cat==='utility') m.addTo(utilLayer);
  else if(cat==='plan') m.addTo(planLayer);   // itinerary-only place
  else m.addTo(layers[cat]);
});
// Monday overlay: route line + a badge above each referenced pin (no duplicate pins)
L.polyline(PLAN_ROUTE,{color:css('var(--c-plan)'),weight:5,opacity:.9})
  .bindPopup('<span class="cat">Monday itinerary</span><h3>Monday route</h3>Temppeliaukio → Huvilakatu → Old Market Hall → Railway Station → Kamppi Chapel. About 5 km on foot.')
  .addTo(planLayer);
PLAN.forEach(s=>{
  const p=byKey[s.key]; if(s.key==='huvila') return;
  L.marker([p[4],p[5]],{zIndexOffset:900,
    icon:L.divIcon({className:'',iconSize:null,iconAnchor:[-8,30],
      html:`<div class="badge">${s.stop}<span>${s.stop==='+'?'optional':s.time.split('–')[0]}</span></div>`})})
   .on('click',()=>markers[s.key].openPopup()).addTo(planLayer);
});
planLayer.addTo(map);
WALKS.forEach(([n,d,pts])=>L.polyline(pts,{color:css('var(--c-notes)'),weight:4,dashArray:'6 8',opacity:.9})
  .bindPopup(`<span class="cat">Saved walk</span><h3>${n}</h3>${d}. Traced from your pen line, so approximate.`).addTo(walkLayer));
walkLayer.addTo(map);

// ---------- Layer chips ----------
const active=new Set(Object.keys(CATS));
const chips=document.getElementById('chips');
Object.entries(CATS).forEach(([k,c])=>{
  const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');
  b.innerHTML=`<i style="background:${c.color}"></i>${c.label}`;
  b.onclick=()=>{const on=active.has(k);on?active.delete(k):active.add(k);b.setAttribute('aria-pressed',String(!on));
    const lyr = k==='plan'?planLayer:layers[k];
    on?map.removeLayer(lyr):lyr.addTo(map);
    if(k==='notes'){on?map.removeLayer(walkLayer):walkLayer.addTo(map);}
    renderList();};
  chips.appendChild(b);
});

// ---------- List ----------
let me=null;
const dist=(a,b,c,d)=>{const R=6371e3,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const fmt=m=>m<1000?`${Math.round(m/10)*10} m`:`${(m/1000).toFixed(1)} km`;
const walkMin=m=>`${Math.max(1,Math.round(m/80))} min`;
const listEl=document.getElementById('list');
function shown(p){const cat=p[2];
  if(cat==='utility') return planOf[p[0]]&&active.has('plan');
  return active.has(cat) || (planOf[p[0]]&&active.has('plan'));}
function renderList(){
  let rows=P.filter(shown);
  if(me) rows=rows.map(p=>[p,dist(me.lat,me.lng,p[4],p[5])]).sort((a,b)=>a[1]-b[1]);
  else{
    const order=k=>planOf[k]&&active.has('plan')?PLAN.indexOf(planOf[k]):99;
    rows=rows.map(p=>[p,null]).sort((a,b)=>order(a[0][0])-order(b[0][0]));
  }
  listEl.innerHTML='';
  rows.forEach(([p,d])=>{
    const [key,label,cat,name,lat,lng,note]=p, done=visited.has(key), pl=planOf[key], s=shape(p);
    const li=document.createElement('li');li.tabIndex=0;if(done)li.classList.add('done');
    li.innerHTML=`<span class="num ${s==='x'?'x':s==='sq'||s==='util'?'sq':''} ${isDark(cat)&&!done?'dark':''} ${CIRCLED.has(key)?'circ':''}" style="background:${catColor(cat)}">${s==='x'?'✕':done?'✓':label}</span>
      <div style="min-width:0"><b>${name}${pl&&active.has('plan')?`<span class="tag plan">${pl.stop==='+'?'Mon opt.':'Mon '+pl.stop+' '+pl.time.split('–')[0]}</span>`:''}${CIRCLED.has(key)?'<span class="tag circ">◎</span>':''}${done?'<span class="tag done">visited</span>':''}</b>${note?`<p>${note}</p>`:''}</div>
      <span class="dist">${d!=null?fmt(d)+'<br>'+walkMin(d):''}</span>`;
    const go=()=>{setFollow(false);map.flyTo([lat,lng],16);setTimeout(()=>markers[key].openPopup(),400);toggleSheet(false);};
    li.onclick=go;li.onkeydown=e=>{if(e.key==='Enter')go();};
    listEl.appendChild(li);
  });
  const v=[...visited].length;
  document.getElementById('summary').textContent = me
    ? `Nearest: ${rows[0]?rows[0][0][3]+' · '+fmt(rows[0][1]):'—'} · ${v} visited`
    : `${rows.length} places · ${v} visited · turn on location to sort by distance`;
}
renderList();

const sheet=document.getElementById('sheet'),handle=document.getElementById('handle');
function toggleSheet(force){const open=force??!sheet.classList.contains('open');sheet.classList.toggle('open',open);handle.setAttribute('aria-expanded',open);}
handle.onclick=()=>toggleSheet();

// ---------- Live location ----------
const btn=document.getElementById('locate'),statusEl=document.getElementById('status');
let watchId=null,meMarker=null,accCircle=null,follow=false,heading=null,first=true;
function say(t,ms=3500){statusEl.textContent=t;statusEl.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>statusEl.hidden=true,ms);}
function setFollow(f){follow=f;btn.classList.toggle('follow',f);}
function meIcon(){return L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],
  html:`<div class="me-wrap">${heading!=null?`<div class="me-cone" style="transform:rotate(${heading}deg)"></div>`:''}<div class="me-dot"></div></div>`});}
function onPos(pos){
  const {latitude:lat,longitude:lng,accuracy,heading:h,speed}=pos.coords;
  if(h!=null&&!isNaN(h)&&speed>0.5) heading=h;
  me={lat,lng};
  if(!meMarker){meMarker=L.marker([lat,lng],{icon:meIcon(),zIndexOffset:1000,interactive:false}).addTo(map);
    accCircle=L.circle([lat,lng],{radius:accuracy,color:css('var(--me)'),weight:1,fillOpacity:.1}).addTo(map);}
  else{meMarker.setLatLng([lat,lng]);meMarker.setIcon(meIcon());accCircle.setLatLng([lat,lng]).setRadius(accuracy);}
  if(first){first=false;map.setView([lat,lng],16);setFollow(true);
    if(dist(lat,lng,60.168,24.942)>20000) say('You look far from Helsinki. The map will still follow you.',5000);}
  else if(follow) map.panTo([lat,lng],{animate:true});
  renderList();
}
function onErr(e){
  const msg={1:'Location permission was denied. Allow it in your browser\'s site settings, then tap again.',
             2:'Your position is unavailable right now. Try moving near a window or outdoors.',
             3:'Getting your location took too long. Tap to try again.'}[e.code]||'Location failed.';
  say(msg,6000); if(e.code===1) stop();
}
function stop(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;btn.classList.remove('on');setFollow(false);}
btn.onclick=async()=>{
  if(!('geolocation' in navigator)){say('This browser has no location support.');return;}
  if(watchId==null){
    if(!window.isSecureContext) say('Location needs an https:// page.',6000);
    btn.classList.add('on');say('Finding you…',2000);first=true;
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
    try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen');}catch(_){}
  } else if(!follow && me){setFollow(true);map.flyTo([me.lat,me.lng],Math.max(map.getZoom(),16));}
  else stop();
};
map.on('dragstart',()=>setFollow(false));
window.addEventListener('deviceorientationabsolute',e=>{if(e.alpha!=null&&meMarker){heading=360-e.alpha;meMarker.setIcon(meIcon());}},true);
window.addEventListener('deviceorientation',e=>{if(e.webkitCompassHeading!=null&&meMarker){heading=e.webkitCompassHeading;meMarker.setIcon(meIcon());}},true);
</script>
</body>
</html>
